<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/src/assets/club-logos/maspalomasrc.png" />
    <meta
      property="og:image"
      content="/src/assets/club-logos/maspalomasrc.png"
    />
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var route = params.get("p");
        if (!route) return;

        var base = window.location.pathname.replace(/\/$/, "");
        var query = params.get("q");
        var destination = base + route;
        if (query) destination += "?" + query;
        window.history.replaceState(null, "", destination);
      })();
    </script>

        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-SN2PL6NYH5');
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
